name: Publish to PyPI

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build production release
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Require a stable release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable tag such as v0.2.0, got: $RELEASE_TAG"
            exit 1
          fi

      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Verify version matches tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python - <<'PY'
          import os
          from importlib.metadata import version

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          actual = version("napari-worm-neuron-annotator")
          if actual != expected:
              raise SystemExit(
                  f"Built version {actual!r} does not match tag {expected!r}"
              )
          PY

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    if: github.event.release.prerelease == false
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/napari-worm-neuron-annotator
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
