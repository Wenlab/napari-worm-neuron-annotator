[project]
name = "napari-worm-neuron-annotator"
dynamic = ["version"]
description = "Navigate and annotate neuron box ROIs on image volumes in napari"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  {name = "JH Wang"},
  {email = "wjh19937458882@mail.ustc.edu.cn"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: napari",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.11,<3.15"
# napari can be included in dependencies if napari imports are required.
# However, you should not include napari[all], napari[qt],
# or any other Qt bindings directly (e.g. PyQt5, PySide2).
# See best practices: https://napari.org/stable/plugins/building_a_plugin/best_practices.html
dependencies = [
    "napari>=0.8,<0.9",
    "numpy",
    "qtpy",
]

[project.optional-dependencies]
# Allow easily installation with the full, default napari installation
# (including Qt backend) using napari-worm-neuron-annotator[all].
all = ["napari[all]>=0.8,<0.9"]
excel = ["openpyxl>=3.1"]
testing = [
    "tox",
    "pytest",  # https://docs.pytest.org/en/latest/contents.html
    "pytest-cov",  # https://pytest-cov.readthedocs.io/en/latest/
    "pytest-qt",  # https://pytest-qt.readthedocs.io/en/latest/
    "napari[pyqt6]>=0.8,<0.9",
]

[project.entry-points."napari.manifest"]
napari-worm-neuron-annotator = "napari_worm_neuron_annotator:napari.yaml"

[project.urls]
"Bug Tracker" = "https://github.com/Wenlab/napari-worm-neuron-annotator/issues"
"Documentation" = "https://github.com/Wenlab/napari-worm-neuron-annotator#README.md"
"Source Code" = "https://github.com/Wenlab/napari-worm-neuron-annotator"
"User Support" = "https://github.com/Wenlab/napari-worm-neuron-annotator/issues"

[build-system]
requires = ["setuptools>=77.0.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.setuptools_scm]
write_to = "src/napari_worm_neuron_annotator/_version.py"
fallback_version = "0.0.1+nogit"

[tool.black]
line-length = 79
target-version = ['py311', 'py312', 'py313']

[tool.ruff]
line-length = 79
lint.select = [
    "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
lint.ignore = [
    "E501", # line too long. let black handle this
    "UP006", "UP007", # Preserve compatibility-oriented runtime annotations.
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".pixi",
    ".pytest_cache",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
]

target-version = "py311"
fix = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
napari-worm-neuron-annotator = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
excel = { features = ["excel"], solve-group = "default" }

[tool.pixi.tasks]
launch-actual = "python scripts/launch_20260304_w3_immobile.py"

[tool.pixi.dependencies]
python = ">=3.11,<3.15"
pytest = ">=8.4.1,<9"
pytest-qt = ">=4.5,<5"
ruff = ">=0.12.9,<0.13"
napari = ">=0.8,<0.9"
pyqt6 = ">=6,<7"
pre_commit = ">=4.3.0,<5"
